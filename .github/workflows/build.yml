name: Build & Release CS2D Binaries

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Test (Windows x64 / MinGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW-w64 GCC + SDL3)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sdl3
            zip

      - name: Compile test_cs2d.exe and cs2d_client.exe
        run: |
          cmd.exe //c build.bat
          cp /mingw64/bin/SDL3.dll .

      - name: Run regression test suite (test_cs2d.exe)
        run: |
          ./test_cs2d.exe

      - name: Package release archive
        run: |
          mkdir -p dist
          cp cs2d_client.exe test_cs2d.exe SDL3.dll dist/
          cd dist
          zip -9 -r ../cs2d-binaries-win64.zip cs2d_client.exe test_cs2d.exe SDL3.dll

      - name: Upload workflow build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cs2d-binaries-win64
          path: |
            cs2d-binaries-win64.zip
            cs2d_client.exe
            test_cs2d.exe
            SDL3.dll
          if-no-files-found: error

      - name: Publish rolling "latest" release on push to default branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "CS2D Reconstructed — Latest Build (${{ github.ref_name }})"
          body: |
            Automated Windows x64 build from commit `${{ github.sha }}`.

            ### Included Files
            - `cs2d-binaries-win64.zip` — Complete bundle (`cs2d_client.exe`, `test_cs2d.exe`, `SDL3.dll`)
            - `cs2d_client.exe` — Standalone reconstructed CS2D client (SDL3 + OpenGL)
            - `test_cs2d.exe` — Regression test suite
            - `SDL3.dll` — SDL3 runtime library (place in the repository root alongside `cs2d_client.exe`)
          prerelease: false
          make_latest: true
          files: |
            cs2d-binaries-win64.zip
            cs2d_client.exe
            test_cs2d.exe
            SDL3.dll

      - name: Publish tagged release (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            cs2d-binaries-win64.zip
            cs2d_client.exe
            test_cs2d.exe
            SDL3.dll

